name: ci

on: [push, pull_request]

jobs:
  demo:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [17, 21]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - run: javac -d build src/CodeDNA.java
      # The demo is the whole contract: every method in Demo.java gets a score
      # and parse() stays at 100%, since nothing works without it.
      - run: |
          java -cp build CodeDNA examples/Demo.java | tee out.txt
          grep -q 'parse()' out.txt
          grep -q '100%' out.txt
      # Tricky.java has braces inside strings, chars, comments and a text block, plus
      # methods with throws clauses and two overloads of report. Every method must show up
      # on its own line, and none may score 100%.
      - run: |
          java -cp build CodeDNA examples/Tricky.java | tee tricky.txt
          for gene in 'brace()' 'risky()' 'block()' 'report(String s)' 'report(int n)'; do grep -qF "$gene" tricky.txt; done
          ! grep -q '100%' tricky.txt
      # Generic.java declares type parameters ("<T>") before the return type.
      # The parser used to read straight past the modifiers into the return type
      # and miss these methods; every one must now get a gene.
      - run: |
          java -cp build CodeDNA examples/Generic.java | tee generic.txt
          for gene in 'pick()' 'first()' 'size()'; do grep -qF "$gene" generic.txt; done
